# Sabit proje adı: sunucudaki DİĞER projeyle container/ağ/volume çakışmasını önler.
name: antalya-bridge

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antalya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antalya}
      POSTGRES_DB: ${POSTGRES_DB:-antalya}
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antalya}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host portu ayarlanabilir (varsayılan 3010) — sunucudaki 3000 başka projede
      # olabilir. Yalnızca localhost'a bağla; dışarıdan erişim nginx üzerinden olur.
      - "127.0.0.1:${WEB_HTTP_PORT:-3010}:3000"
    # İlk açılışta: migration'ları uygula → seed (idempotent) → sunucuyu başlat.
    # Prisma CLI imaja gömülü olduğundan ağ indirmesi gerekmez.
    command: sh -c "node node_modules/prisma/build/index.js migrate deploy && (node prisma/seed.js || true) && node server.js"

  # Opsiyonel: Nginx reverse proxy + SSL (sunucuda etkinleştirin)
