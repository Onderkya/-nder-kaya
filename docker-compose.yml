services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antalya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antalya}
      POSTGRES_DB: ${POSTGRES_DB:-antalya}
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antalya}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    # İlk açılışta migration uygula + seed çalıştır, sonra sunucuyu başlat.
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js || true; node server.js"

