# Antalya Bridge — Nginx reverse proxy örneği.
# Sunucuda: SSL için certbot ile sertifika alın ve aşağıdaki server bloğunu
# kendi alan adınıza göre düzenleyin.

server {
    listen 80;
    server_name antalyabridge.com www.antalyabridge.com;

    # Let's Encrypt doğrulaması için
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

