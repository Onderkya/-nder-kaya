# Antalya Bridge — nginx reverse proxy server block.
#
# Bu AYRI bir dosyadır; mevcut (diğer projeye ait) nginx ayarlarına DOKUNMAZ.
# Kurulum:
#   sudo cp deploy/nginx-antalyabridge.conf /etc/nginx/sites-available/antalyabridge
#   sudo ln -s /etc/nginx/sites-available/antalyabridge /etc/nginx/sites-enabled/
#   # <DOMAIN> yerine gerçek alan adını yaz (örn. antalyabridge.com)
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <DOMAIN> -d www.<DOMAIN>   # SSL'i certbot ekler
#
# Not: WEB_HTTP_PORT'u .env'de değiştirdiysen aşağıdaki 3010'u da güncelle.

server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN> www.<DOMAIN>;

    # Yükleme/iletişim formu için makul gövde sınırı.
    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
